const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function open_(pw){
  const e=new TextEncoder();
  const b=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:600000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(p);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
f.addEventListener('submit',async ev=>{
  ev.preventDefault();go.disabled=true;err.textContent='';
  const pw=document.getElementById('pw').value;
  try{const h=await open_(pw);try{sessionStorage.setItem('vh_pw',pw)}catch(_){}show(h);}
  catch(_){err.textContent='Hibás jelszó.';go.disabled=false;}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('vh_pw')}catch(_){}if(s){try{show(await open_(s))}catch(_){}}})();
</script>
