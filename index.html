<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Valdheim Launcher</title>
<link rel="icon" type="image/png" href="assets/img/icon.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root { --bg: #0E1116; --panel: #141A21; --border: #1F2630; --border-2: #2A3440; --text: #E6EAF0; --muted: #A6B0BD; --accent: #7BD957; --accent-ink: #0B1208; --danger: #FF7B72; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  form { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  input { height: 46px; border-radius: 10px; border: 1px solid var(--border-2); background: #0A0C10; color: var(--text); padding: 0 14px; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: var(--danger); min-height: 1.4em; }
</style>
</head>
